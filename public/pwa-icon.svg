<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Subtle radial geometric pattern -->
    <g opacity="0.07" stroke="white" stroke-width="1.2" fill="none">
      <circle cx="256" cy="280" r="200"/>
      <circle cx="256" cy="280" r="160"/>
      <circle cx="256" cy="280" r="120"/>
      <line x1="56" y1="280" x2="456" y2="280"/>
      <line x1="256" y1="80" x2="256" y2="480"/>
      <line x1="114" y1="138" x2="398" y2="422"/>
      <line x1="398" y1="138" x2="114" y2="422"/>
      <polygon points="256,120 336,180 336,300 256,360 176,300 176,180" stroke-width="1.5"/>
    </g>
    <!-- Outer octagonal frame -->
    <polygon points="256,52 376,108 424,228 424,332 376,452 256,508 136,452 88,332 88,228 136,108"
      fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Shopping bag body -->
    <rect x="168" y="210" width="176" height="190" rx="16" fill="white"/>
    <!-- Bag top fold -->
    <rect x="168" y="210" width="176" height="20" rx="8" fill="#F3F4F6"/>
    <!-- Bag handle -->
    <path d="M210,210 L210,170 Q210,136 238,136 L274,136 Q302,136 302,170 L302,210"
      fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <!-- Handle inner shadow -->
    <path d="M218,210 L218,172 Q218,144 242,144 L270,144 Q294,144 294,172 L294,210"
      fill="none" stroke="rgba(15,118,110,0.15)" stroke-width="2"/>
    <!-- Gold crescent -->
    <circle cx="288" cy="166" r="30" fill="url(#gold)"/>
    <circle cx="298" cy="159" r="24" fill="url(#bg)"/>
    <!-- Gold star -->
    <polygon points="278,148 281,156 290,156 283,161 286,170 278,165 270,170 273,161 266,156 275,156"
      fill="url(#gold)"/>
    <!-- Islamic geometric diamond pattern on bag -->
    <g opacity="0.1" fill="none" stroke="#0F766E" stroke-width="1.8">
      <polygon points="256,248 280,262 280,290 256,304 232,290 232,262"/>
      <polygon points="256,260 272,269 272,287 256,296 240,287 240,269"/>
      <line x1="232" y1="310" x2="280" y2="310"/>
      <line x1="232" y1="326" x2="280" y2="326"/>
      <line x1="232" y1="342" x2="280" y2="342"/>
      <line x1="232" y1="358" x2="280" y2="358"/>
      <line x1="244" y1="310" x2="244" y2="370"/>
      <line x1="256" y1="310" x2="256" y2="370"/>
      <line x1="268" y1="310" x2="268" y2="370"/>
    </g>
    <!-- Bag left highlight -->
    <rect x="180" y="224" width="18" height="120" rx="9" fill="white" opacity="0.4"/>
    <!-- Bag bottom edge -->
    <rect x="168" y="382" width="176" height="18" rx="6" fill="#E5E7EB"/>
    <!-- Small decorative dots -->
    <circle cx="200" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="220" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="240" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="260" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="280" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="300" cy="382" r="2" fill="#D1D5DB"/>
    <circle cx="312" cy="382" r="2" fill="#D1D5DB"/>
  </g>
</svg>
