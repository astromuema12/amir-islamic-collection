<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none" role="img" aria-label="Amir Islamic Collections product image placeholder">
  <defs>
    <linearGradient id="aic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="52%" stop-color="#07231C" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>
    <radialGradient id="aic-glow" cx="50%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="aic-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D4A843" />
    </linearGradient>
    <pattern id="aic-geo" width="96" height="96" patternUnits="userSpaceOnUse">
      <g stroke="#FBBF24" stroke-width="1" opacity="0.14" fill="none">
        <rect x="24" y="24" width="48" height="48" rx="7" />
        <rect x="24" y="24" width="48" height="48" rx="7" transform="rotate(45 48 48)" />
        <circle cx="48" cy="48" r="9" />
      </g>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#aic-bg)" />
  <rect width="800" height="600" fill="url(#aic-glow)" />
  <rect width="800" height="600" fill="url(#aic-geo)" />

  <g transform="translate(400 284)">
    <circle r="122" stroke="url(#aic-gold)" stroke-width="1.5" opacity="0.4" />
    <circle r="104" stroke="url(#aic-gold)" stroke-width="1" opacity="0.22" />
    <g fill="url(#aic-gold)" opacity="0.92">
      <rect x="-56" y="-56" width="112" height="112" rx="12" />
      <rect x="-56" y="-56" width="112" height="112" rx="12" transform="rotate(45)" />
    </g>
    <circle r="33" fill="#0A1626" />
    <circle r="33" stroke="url(#aic-gold)" stroke-width="2" opacity="0.9" />
  </g>
</svg>
